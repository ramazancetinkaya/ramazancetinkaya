name: Update Top Repositories

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch repositories and render modern tables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import re
          import requests

          USERNAME = "ramazancetinkaya"
          HEADERS = {
              "Accept": "application/vnd.github+json"
          }
          token = os.getenv("GITHUB_TOKEN")
          if token:
              HEADERS["Authorization"] = f"Bearer {token}"

          def fetch_original_repos():
              repos = []
              page = 1
              while True:
                  # type=owner retrieves only repositories owned directly by the user
                  url = f"https://api.github.com/users/{USERNAME}/repos?per_page=100&page={page}&type=owner"
                  response = requests.get(url, headers=HEADERS)
                  if response.status_code != 200:
                      print(f"Failed to fetch repos: {response.status_code} - {response.text}")
                      break

                  data = response.json()
                  if not data or not isinstance(data, list):
                      break

                  # Explicitly filter out any repositories marked as forks
                  for repo in data:
                      if not repo.get("fork", False):
                          repos.append(repo)

                  if len(data) < 100:
                      break
                  page += 1
              return repos

          def render_table(repo_list, count_key, metric_header):
              if not repo_list:
                  return "_No public repositories found._"

              header = (
                  f"| Repository | Description | Primary Language | {metric_header} |\n"
                  f"| :--- | :--- | :---: | :---: |"
              )
              
              rows = []
              for repo in repo_list[:5]:
                  name = repo["name"]
                  url = repo["html_url"]
                  raw_desc = repo.get("description") or "No description provided."
                  # Sanitize pipes and newlines to preserve table alignment
                  desc = raw_desc.replace("|", "&#124;").replace("\n", " ").strip()
                  lang = repo.get("language") or "Markdown"
                  count = repo.get(count_key, 0)

                  rows.append(f"| [**{name}**]({url}) | {desc} | `{lang}` | **{count}** |")

              return header + "\n" + "\n".join(rows)

          repos = fetch_original_repos()

          top_starred = sorted(repos, key=lambda r: r.get("stargazers_count", 0), reverse=True)
          top_forked = sorted(repos, key=lambda r: r.get("forks_count", 0), reverse=True)

          starred_table = render_table(top_starred, "stargazers_count", "Stars ⭐")
          forked_table = render_table(top_forked, "forks_count", "Forks 🍴")

          with open("README.md", "r", encoding="utf-8") as f:
              readme_content = f.read()

          starred_pattern = r"()(.*?)()"
          readme_content = re.sub(starred_pattern, f"\\1\n\n{starred_table}\n\n\\3", readme_content, flags=re.DOTALL)

          forked_pattern = r"()(.*?)()"
          readme_content = re.sub(forked_pattern, f"\\1\n\n{forked_table}\n\n\\3", readme_content, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "style: format top repositories table" && git push)
