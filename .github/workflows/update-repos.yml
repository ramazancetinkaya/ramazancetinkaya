name: Update Top Repositories

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch repositories and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import re
          import requests

          USERNAME = "ramazancetinkaya"
          HEADERS = {
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": f"{USERNAME}-readme-updater",
          }

          token = os.getenv("GITHUB_TOKEN")
          if token:
              HEADERS["Authorization"] = f"Bearer {token}"

          def fetch_original_repos():
              repos = []
              page = 1
              while True:
                  url = f"https://api.github.com/users/{USERNAME}/repos?per_page=100&page={page}&type=owner"
                  response = requests.get(url, headers=HEADERS)
                  if response.status_code != 200:
                      print(f"Failed to fetch repositories: {response.status_code}")
                      break
                  
                  data = response.json()
                  if not data or not isinstance(data, list):
                      break

                  for repo in data:
                      # Exclude forks; keep only repositories originally created by the user
                      if not repo.get("fork"):
                          repos.append(repo)

                  if len(data) < 100:
                      break
                  page += 1
              return repos

          def clean_description(text, max_len=75):
              if not text:
                  return "No description provided."
              # Prevent broken Markdown tables by replacing pipes and line breaks
              sanitized = text.replace("|", "/").replace("\n", " ").replace("\r", " ").strip()
              if len(sanitized) > max_len:
                  return sanitized[:max_len].rstrip() + "..."
              return sanitized

          def get_last_updated_date(repo):
              # Prefer 'pushed_at' for actual code commits, fallback to 'updated_at'
              raw_date = repo.get("pushed_at") or repo.get("updated_at") or ""
              return raw_date[:10] if len(raw_date) >= 10 else "-"

          def generate_table(repo_list, metric_key, metric_icon, metric_title):
              if not repo_list:
                  return "_No public repositories found._"

              headers = (
                  f"| # | Repository | Description | Language | {metric_icon} {metric_title} | Last Updated |\n"
                  f"| :-: | :-- | :-- | :-: | :-: | :-: |"
              )
              rows = []
              for rank, repo in enumerate(repo_list[:5], start=1):
                  name = repo.get("name", "Unknown")
                  url = repo.get("html_url", "#")
                  desc = clean_description(repo.get("description"))
                  lang = repo.get("language")
                  lang_badge = f"`{lang}`" if lang else "-"
                  metric_value = f"{repo.get(metric_key, 0):,}"
                  last_updated = get_last_updated_date(repo)

                  rows.append(
                      f"| **{rank}** | [**{name}**]({url}) | {desc} | {lang_badge} | {metric_value} | `{last_updated}` |"
                  )

              return headers + "\n" + "\n".join(rows)

          def replace_section(content, section_name, new_table):
              pattern = rf"(<!-- START_SECTION:{section_name} -->)(.*?)(<!-- END_SECTION:{section_name} -->)"
              replacement = f"\\1\n\n{new_table}\n\n\\3"
              return re.sub(pattern, replacement, content, flags=re.DOTALL)

          all_repos = fetch_original_repos()

          # Sort by metric count DESC, then by latest push/update date DESC as tie-breaker
          sort_key_starred = lambda r: (r.get("stargazers_count", 0), r.get("pushed_at") or r.get("updated_at") or "")
          sort_key_forked = lambda r: (r.get("forks_count", 0), r.get("pushed_at") or r.get("updated_at") or "")

          top_starred = sorted(all_repos, key=sort_key_starred, reverse=True)
          top_forked = sorted(all_repos, key=sort_key_forked, reverse=True)

          starred_table = generate_table(top_starred, "stargazers_count", "⭐", "Stars")
          forked_table = generate_table(top_forked, "forks_count", "🍴", "Forks")

          with open("README.md", "r", encoding="utf-8") as f:
              readme_content = f.read()

          readme_content = replace_section(readme_content, "starred", starred_table)
          readme_content = replace_section(readme_content, "forked", forked_table)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "docs(readme): sync top starred and forked projects" && git push)
